name: Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

env:
  AZURE_RESOURCE_GROUP: synapse-demo-${{ github.event.inputs.environment || 'dev' }}-rg
  AZURE_LOCATION: eastus
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get ACR name
        id: acr
        run: |
          ACR_NAME=$(az deployment group show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name latest-deployment \
            --query properties.outputs.containerRegistryName.value \
            -o tsv 2>/dev/null || echo "")
          
          if [ -z "$ACR_NAME" ]; then
            echo "Container Registry not found. Please deploy infrastructure first."
            exit 1
          fi
          
          echo "acr_name=$ACR_NAME" >> $GITHUB_OUTPUT
          
          ACR_SERVER=$(az acr show --name $ACR_NAME --query loginServer -o tsv)
          echo "acr_server=$ACR_SERVER" >> $GITHUB_OUTPUT

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ steps.acr.outputs.acr_server }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push kafka-producer-api
        run: |
          docker build -t ${{ steps.acr.outputs.acr_server }}/kafka-producer-api:${{ github.sha }} \
            -t ${{ steps.acr.outputs.acr_server }}/kafka-producer-api:latest \
            ./packages/kafka-producer-api
          docker push ${{ steps.acr.outputs.acr_server }}/kafka-producer-api:${{ github.sha }}
          docker push ${{ steps.acr.outputs.acr_server }}/kafka-producer-api:latest

      - name: Build and push kafka-consumer-service
        run: |
          docker build -t ${{ steps.acr.outputs.acr_server }}/kafka-consumer-service:${{ github.sha }} \
            -t ${{ steps.acr.outputs.acr_server }}/kafka-consumer-service:latest \
            ./packages/kafka-consumer-service
          docker push ${{ steps.acr.outputs.acr_server }}/kafka-consumer-service:${{ github.sha }}
          docker push ${{ steps.acr.outputs.acr_server }}/kafka-consumer-service:latest

      - name: Build and push azure-function-app
        run: |
          docker build -t ${{ steps.acr.outputs.acr_server }}/azure-function-app:${{ github.sha }} \
            -t ${{ steps.acr.outputs.acr_server }}/azure-function-app:latest \
            ./packages/azure-function-app
          docker push ${{ steps.acr.outputs.acr_server }}/azure-function-app:${{ github.sha }}
          docker push ${{ steps.acr.outputs.acr_server }}/azure-function-app:latest

      - name: Build and push servicebus-publisher
        run: |
          docker build -t ${{ steps.acr.outputs.acr_server }}/servicebus-publisher:${{ github.sha }} \
            -t ${{ steps.acr.outputs.acr_server }}/servicebus-publisher:latest \
            ./packages/servicebus-publisher
          docker push ${{ steps.acr.outputs.acr_server }}/servicebus-publisher:${{ github.sha }}
          docker push ${{ steps.acr.outputs.acr_server }}/servicebus-publisher:latest

  deploy-function-app:
    name: Deploy Azure Function App
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get Function App name
        id: function
        run: |
          FUNCTION_APP_NAME=$(az deployment group show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name latest-deployment \
            --query properties.outputs.functionAppName.value \
            -o tsv 2>/dev/null || echo "")
          
          if [ -z "$FUNCTION_APP_NAME" ]; then
            echo "Function App not found. Please deploy infrastructure first."
            exit 1
          fi
          
          echo "function_app_name=$FUNCTION_APP_NAME" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          cd packages/azure-function-app
          npm ci

      - name: Build Function App
        run: |
          cd packages/azure-function-app
          npm run build

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.function.outputs.function_app_name }}
          package: packages/azure-function-app

  update-container-instances:
    name: Update Container Instances
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Restart Container Instances
        run: |
          # Get all container groups in resource group
          CONTAINER_GROUPS=$(az container list \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "[].name" -o tsv)
          
          # Restart each container group to pull latest images
          for container in $CONTAINER_GROUPS; do
            echo "Restarting $container..."
            az container restart \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --name $container
          done
