apiVersion: v1
kind: ConfigMap
metadata:
  name: synapse-config
  namespace: demo-app
  labels:
    app: synapse-demo
data:
  # Kafka Configuration
  KAFKA_TOPIC: "demo-events"
  KAFKA_GROUP_ID: "consumer-group-1"
  KAFKA_FROM_BEGINNING: "false"
  KAFKA_PARTITIONS: "3"
  KAFKA_REPLICATION_FACTOR: "1"
  
  # Service Bus Configuration
  SERVICE_BUS_QUEUE_NAME: "demo-queue"
  
  # Logging Configuration
  LOG_LEVEL: "info"
  
  # Port Configuration
  KAFKA_PRODUCER_PORT: "3001"
  KAFKA_CONSUMER_HEALTH_PORT: "3002"
  SERVICEBUS_PUBLISHER_PORT: "3003"
