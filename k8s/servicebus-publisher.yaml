apiVersion: apps/v1
kind: Deployment
metadata:
  name: servicebus-publisher
  namespace: demo-app
  labels:
    app: servicebus-publisher
    component: synapse-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: servicebus-publisher
  template:
    metadata:
      labels:
        app: servicebus-publisher
        component: synapse-demo
    spec:
      containers:
      - name: servicebus-publisher
        image: <your-registry>/servicebus-publisher:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3003
          protocol: TCP
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: synapse-config
              key: SERVICEBUS_PUBLISHER_PORT
        - name: SERVICE_BUS_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: synapse-secrets
              key: SERVICE_BUS_CONNECTION_STRING
        - name: SERVICE_BUS_QUEUE_NAME
          valueFrom:
            configMapKeyRef:
              name: synapse-config
              key: SERVICE_BUS_QUEUE_NAME
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: synapse-config
              key: LOG_LEVEL
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: servicebus-publisher
  namespace: demo-app
  labels:
    app: servicebus-publisher
    component: synapse-demo
spec:
  type: ClusterIP
  ports:
  - port: 3003
    targetPort: 3003
    protocol: TCP
    name: http
  selector:
    app: servicebus-publisher
