apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-consumer-service
  namespace: demo-app
  labels:
    app: kafka-consumer-service
    component: synapse-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-consumer-service
  template:
    metadata:
      labels:
        app: kafka-consumer-service
        component: synapse-demo
    spec:
      containers:
      - name: kafka-consumer-service
        image: <your-registry>/kafka-consumer-service:latest
        imagePullPolicy: Always
        ports:
        - name: health
          containerPort: 3002
          protocol: TCP
        env:
        - name: KAFKA_BROKERS
          value: "kafka-service:9092"
        - name: KAFKA_TOPIC
          valueFrom:
            configMapKeyRef:
              name: synapse-config
              key: KAFKA_TOPIC
        - name: KAFKA_GROUP_ID
          valueFrom:
            configMapKeyRef:
              name: synapse-config
              key: KAFKA_GROUP_ID
        - name: KAFKA_FROM_BEGINNING
          valueFrom:
            configMapKeyRef:
              name: synapse-config
              key: KAFKA_FROM_BEGINNING
        - name: HEALTH_CHECK_PORT
          valueFrom:
            configMapKeyRef:
              name: synapse-config
              key: KAFKA_CONSUMER_HEALTH_PORT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: synapse-config
              key: LOG_LEVEL
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-consumer-service
  namespace: demo-app
  labels:
    app: kafka-consumer-service
    component: synapse-demo
spec:
  type: ClusterIP
  ports:
  - port: 3002
    targetPort: 3002
    protocol: TCP
    name: health
  selector:
    app: kafka-consumer-service
