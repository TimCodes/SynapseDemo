apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: synapse-ingress
  namespace: demo-app
  labels:
    app: synapse-demo
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: demo.local  # Change to your domain or use IP
    http:
      paths:
      - path: /api/producer
        pathType: Prefix
        backend:
          service:
            name: kafka-producer-api
            port:
              number: 3001
      - path: /api/consumer
        pathType: Prefix
        backend:
          service:
            name: kafka-consumer-service
            port:
              number: 3002
      - path: /api/function
        pathType: Prefix
        backend:
          service:
            name: azure-function-app
            port:
              number: 80
      - path: /api/servicebus
        pathType: Prefix
        backend:
          service:
            name: servicebus-publisher
            port:
              number: 3003
