apiVersion: v1
kind: Secret
metadata:
  name: synapse-secrets
  namespace: demo-app
  labels:
    app: synapse-demo
type: Opaque
stringData:
  # Azure Service Bus Connection String
  # Replace with your actual connection string before deploying
  SERVICE_BUS_CONNECTION_STRING: "Endpoint=sb://<your-namespace>.servicebus.windows.net/;SharedAccessKeyName=<key-name>;SharedAccessKey=<key-value>"
  
  # Azure Storage Connection String for Azure Functions
  # For production, use actual Azure Storage account
  # For local/dev, use Azurite connection string
  AZURE_WEB_JOBS_STORAGE: "DefaultEndpointsProtocol=https;AccountName=<storage-account-name>;AccountKey=<storage-account-key>;EndpointSuffix=core.windows.net"
