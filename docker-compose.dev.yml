version: '3.8'

# Development Docker Compose with volume mounts for hot reload
# Use: docker-compose -f docker-compose.dev.yml up

services:
  # Zookeeper - Required for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: synapse-zookeeper-dev
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - synapse-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: synapse-kafka-dev
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - synapse-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Kafka Topic Initializer
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: synapse-kafka-init-dev
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - synapse-network
    command: >
      bash -c "
        echo 'Waiting for Kafka to be ready...' &&
        kafka-topics --bootstrap-server kafka:29092 --list &&
        echo 'Creating demo-events topic...' &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic demo-events --replication-factor 1 --partitions 3 &&
        echo 'Topic created successfully!' &&
        kafka-topics --bootstrap-server kafka:29092 --describe --topic demo-events
      "

  # Azurite - Local Azure Storage Emulator
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: synapse-azurite-dev
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    networks:
      - synapse-network
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --loose"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:10000"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SQL Server - Required for Service Bus Emulator
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: synapse-sql-server-dev
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Pass@word123"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    networks:
      - synapse-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Pass@word123 -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Azure Service Bus Emulator - Local Service Bus Emulator
  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: synapse-servicebus-emulator-dev
    depends_on:
      sql-server:
        condition: service_healthy
    ports:
      - "5672:5672"
    environment:
      ACCEPT_EULA: "Y"
      SERVICEBUS_LOGGING_LEVEL: "Information"
      SQL_SERVER: "sql-server"
      MSSQL_SA_PASSWORD: "Pass@word123"
      Config__SqlConnectionString: "Data Source=sql-server,1433;User Id=sa;Password=Pass@word123;Initial Catalog=master;Encrypt=false;TrustServerCertificate=true;"
    volumes:
      - ./packages/servicebus-emulator/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    networks:
      - synapse-network
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/emulator-ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Kafka Producer API - Development Mode with Volume Mounts
  kafka-producer-api:
    build:
      context: ./packages/kafka-producer-api
      dockerfile: Dockerfile
    container_name: synapse-kafka-producer-dev
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: demo-events
      LOG_LEVEL: debug
      NODE_ENV: development
    volumes:
      - ./packages/kafka-producer-api/src:/app/src:ro
      - ./packages/kafka-producer-api/package.json:/app/package.json:ro
      - /app/node_modules
    networks:
      - synapse-network
    command: npm run dev

  # Kafka Consumer Service - Development Mode with Volume Mounts
  kafka-consumer-service:
    build:
      context: ./packages/kafka-consumer-service
      dockerfile: Dockerfile
    container_name: synapse-kafka-consumer-dev
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "3002:3002"
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: demo-events
      KAFKA_GROUP_ID: consumer-group-1
      KAFKA_FROM_BEGINNING: "false"
      HEALTH_CHECK_PORT: 3002
      LOG_LEVEL: debug
      NODE_ENV: development
    volumes:
      - ./packages/kafka-consumer-service/src:/app/src:ro
      - ./packages/kafka-consumer-service/package.json:/app/package.json:ro
      - /app/node_modules
    networks:
      - synapse-network
    command: npm run dev

  # Azure Function App - Development Mode
  azure-function-app:
    build:
      context: ./packages/azure-function-app
      dockerfile: Dockerfile
    container_name: synapse-azure-functions-dev
    depends_on:
      - azurite
      - servicebus-emulator
    ports:
      - "7071:80"
    environment:
      AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;"
      FUNCTIONS_WORKER_RUNTIME: node
      ServiceBusConnection: "Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
    volumes:
      - ./packages/azure-function-app/http-trigger:/home/site/wwwroot/http-trigger:ro
      - ./packages/azure-function-app/servicebus-trigger:/home/site/wwwroot/servicebus-trigger:ro
    networks:
      - synapse-network

  # Service Bus Publisher - Development Mode with Volume Mounts
  servicebus-publisher:
    build:
      context: ./packages/servicebus-publisher
      dockerfile: Dockerfile
    container_name: synapse-servicebus-publisher-dev
    depends_on:
      - servicebus-emulator
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      SERVICE_BUS_CONNECTION_STRING: "Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      SERVICE_BUS_QUEUE_NAME: "demo-queue"
      LOG_LEVEL: debug
      NODE_ENV: development
    volumes:
      - ./packages/servicebus-publisher/src:/app/src:ro
      - ./packages/servicebus-publisher/package.json:/app/package.json:ro
      - /app/node_modules
    networks:
      - synapse-network
    command: npm run dev

networks:
  synapse-network:
    name: synapse-network-dev
    driver: bridge

volumes:
  zookeeper-data:
  kafka-data:
  azurite-data:
